rites structured proposals.</text><text x="416" y="244" font-family="vt-mono" font-weight="500" font-size="12" fill="#B4612F" text-anchor="start">Python · Go · Claude</text><text x="784" y="136" font-family="vt-display" font-weight="700" font-size="22" fill="#0D2529" text-anchor="start" letter-spacing="-0.3">Plan With a Pro</text><text x="784" y="164" font-family="vt-body" font-weight="400" font-size="15" fill="#4F5D5E" text-anchor="start">Insurance CRM with WebRTC calling,</text><text x="784" y="185" font-family="vt-body" font-weight="400" font-size="15" fill="#4F5D5E" text-anchor="start">conferencing, transfers, IVR and ad lead</text><text x="784" y="206" font-family="vt-body" font-weight="400" font-size="15" fill="#4F5D5E" text-anchor="start">capture.</text><text x="784" y="244" font-family="vt-mono" font-weight="500" font-size="12" fill="#B4612F" text-anchor="start">Twilio Voice · Google and Meta Ads</text><text x="48" y="306" font-family="vt-display" font-weight="700" font-size="22" fill="#0D2529" text-anchor="start" letter-spacing="-0.3">Vespucci</text><text x="48" y="334" font-family="vt-body" font-weight="400" font-size="15" fill="#4F5D5E" text-anchor="start">Multi-tenant travel SaaS with AI document</text><text x="48" y="355" font-family="vt-body" font-weight="400" font-size="15" fill="#4F5D5E" text-anchor="start">extraction, double-entry accounting and</text><text x="48" y="376" font-family="vt-body" font-weight="400" font-size="15" fill="#4F5D5E" text-anchor="start">LLM failover.</text><text x="48" y="414" font-family="vt-mono" font-weight="500" font-size="12" fill="#B4612F" text-anchor="start">Go · PostgreSQL · Keycloak</text><text x="416" y="306" font-family="vt-display" font-weight="700" font-size="22" fill="#0D2529" text-anchor="start" letter-spacing="-0.3">Flexecution</text><text x="416" y="334" font-family="vt-body" font-weight="400" font-size="15" fill="#4F5D5E" text-anchor="start">Multi-tenant enterprise ERP with seven</text><text x="416" y="355" 